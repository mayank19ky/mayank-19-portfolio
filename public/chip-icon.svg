<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Silicon Die -->
  <rect x="12" y="12" width="40" height="40" rx="6" fill="#0c1426" stroke="#00f2fe" stroke-width="2"/>
  
  <!-- Inner Core -->
  <rect x="20" y="20" width="24" height="24" rx="3" fill="#080d1a" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="5" fill="#00f2fe" fill-opacity="0.8"/>
  
  <!-- Circuit Traces inside -->
  <path d="M26 26L32 32M38 26L32 32M26 38L32 32M38 38L32 32" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Pins: Top -->
  <line x1="20" y1="4" x2="20" y2="12" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="4" x2="28" y2="12" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="4" x2="36" y2="12" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="4" x2="44" y2="12" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Pins: Bottom -->
  <line x1="20" y1="52" x2="20" y2="60" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="52" x2="28" y2="60" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="52" x2="36" y2="60" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
  <line x1="44" y1="52" x2="44" y2="60" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Pins: Left -->
  <line x1="4" y1="20" x2="12" y2="20" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="28" x2="12" y2="28" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="36" x2="12" y2="36" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="44" x2="12" y2="44" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Pins: Right -->
  <line x1="52" y1="20" x2="60" y2="20" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="28" x2="60" y2="28" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="36" x2="60" y2="36" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="44" x2="60" y2="44" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  
